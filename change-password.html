<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password | Student Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="portal-page">
  <div class="portal-card">
    <img src="assets/school-logo.jpg" class="portal-logo" alt="School logo">
    <p class="eyebrow">FIRST LOGIN</p>
    <h1>Change Your Password</h1>
    <p class="muted">For security, students should replace the temporary password with a private password.</p>
    <form id="changePasswordForm">
      <label>New password<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Confirm password<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn primary full" type="submit">Update Password</button>
      <p id="passwordMessage" class="form-message"></p>
    </form>
  </div>
  <script type="module" src="js/change-password.js"></script>
</body>
</html>
