<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Officer | Madarasatul Hayatul Islam Kidandan</title><link rel="stylesheet" href="css/style.css"></head><body class="dashboard"><aside class="sidebar"><div class="side-brand"><img src="assets/school-logo.jpg"><span>Exam Officer</span></div><button class="side-link active">Exams & Results</button><button class="side-link" id="refresh">Refresh</button><button class="side-link logout" id="logout">Logout</button></aside><main class="dash-main"><div class="dash-top"><div><p class="eyebrow">EXAMINATION DEPARTMENT</p><h1>Exams & Results</h1><p class="muted">Create subjects, assign classes, enter marks and publish results to student dashboards.</p></div><span class="chip" id="who">Loading...</span></div><div class="stats"><div class="stat"><span>Students</span><strong id="studentCount">—</strong></div><div class="stat"><span>Exams</span><strong id="examCount">—</strong></div><div class="stat"><span>Results</span><strong id="resultCount">—</strong></div></div><div class="grid"><section class="panel"><h2>Create Examination / Subject</h2><form id="examForm"><label>Exam Title<input id="title" placeholder="First Term Examination" required></label><label>Academic Session<input id="session" placeholder="2026/2027" required></label><label>Term<select id="term" required><option value="">Select</option><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Section<select id="examSection" required><option value="">Select</option><option>Islamiyya</option><option>Hifz</option><option>Academy</option></select></label><label>Subject<input id="subject" list="subjectSuggestions" placeholder="Write or select a subject" required><datalist id="subjectSuggestions"></datalist></label><div><strong>Assign classes / levels</strong><div id="levelChecks" class="check-grid"><span class="muted">Select a section first.</span></div></div><label>Exam Date<input id="date" type="date" required></label><button class="btn primary">Create Exam</button><p id="examMsg" class="message"></p></form></section><section class="panel"><h2>Enter Result</h2><form id="resultForm"><label>Exam / Subject<select id="examSelect" required><option value="">Select exam</option></select></label><label>Student<select id="studentSelect" required><option value="">Select an exam first</option></select></label><label>Score (0–100)<input id="score" type="number" min="0" max="100" required></label><label>Remark<input id="remark" placeholder="Optional remark"></label><button class="btn primary">Save Result</button><p id="resultMsg" class="message"></p></form></section></div><section class="panel" style="margin-top:18px"><h2>All Examinations</h2><div id="examTable"></div></section></main><script type="module" src="js/exam-officer.js"></script></body></html>
