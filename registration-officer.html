<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Officer</title><link rel="stylesheet" href="css/style.css"></head><body class="dashboard"><aside class="sidebar"><div class="side-brand"><img src="assets/school-logo.jpg"><span>Registration</span></div><button class="side-link active">Register Student</button><button class="side-link" id="load">Students</button><button class="side-link logout" id="logout">Logout</button></aside><main class="dash-main"><div class="dash-top"><div><p class="eyebrow">REGISTRATION OFFICER</p><h1>Student Registration</h1></div><span class="chip" id="who">Loading...</span></div><div class="grid"><section class="panel"><h2>Register New Student</h2><form id="form"><label>Full Name<input id="name" required></label><label>Student ID<input id="studentId" required></label><label>Section<select id="section" required><option value="">Select</option><option>Islamiyya</option><option>Hifz</option><option>Academy</option></select></label><label>Level / Class<select id="level" required><option value="">Select section first</option></select></label><label>Gender<select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option></select></label><label>Date of Birth<input id="dob" type="date" required></label><label>Parent/Guardian Name<input id="guardian" required></label><label>Phone<input id="phone"></label><label>Student Email (optional)<input id="studentEmail" type="email"></label><button class="btn primary">Register Student</button><p id="msg" class="message"></p></form></section><section class="panel"><h2>Student Records</h2><p>Registration Officer can register and view students. Student deletion and user-role management remain with Super Admin.</p><button class="btn secondary" id="load2">Load Students</button><div id="table"></div></section></div></main><script type="module" src="js/registration-officer.js"></script></body></html>
